<div class="header">
    <div class="left">
        <h1>📁 Notes App</h1>
    </div>

    <div class="middle">
        <input
            type="text"
            placeholder="🔍 Search notes..."
            #searchBar
            (input)="searchEvent(searchBar.value)"
        />
    </div>

    <div class="right">
        <select #themeSelector [value]="theme" (change)="toggleTheme(themeSelector.value)">
            <option value="light">☀️ Light Mode</option>
            <option value="dark">🌙 Dark Mode</option>
        </select>
    </div>
</div>
